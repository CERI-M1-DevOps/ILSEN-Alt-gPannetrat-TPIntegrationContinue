name: Java CI with Maven - Test and package

on: [pull_request]

jobs:
  test-package:
    name: Test Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
      - run: mvn -B package